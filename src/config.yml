data:
  train_path: data/aps_failure_training_set.csv
  test_path: data/aps_failure_test_set.csv
  skip_rows: 20
  na_values: na
  target_column: class
  positive_label: pos
  negative_label: neg

preprocessing:
  imputation_strategy: median

eda:
  top_features_count: 13

random_forest:
  n_estimators: 100
  random_state: 42

xgboost:
  booster: gblinear
  objective: binary:logistic
  random_state: 42
  n_jobs: 1
  alpha_grid: [0.001, 0.01, 0.1, 1, 10, 100]
  alpha_grid_smote: [0.001, 0.01, 0.1, 1, 10, 100, 500, 1000]

cross_validation:
  folds: 10
  scoring: roc_auc

smote:
  random_state: 42

cost:
  fp_cost: 10
  fn_cost: 500

mlflow:
  tracking_uri: sqlite:///C:/Users/denni/PycharmProjects/aps-failure-prediction/mlflow.db
  experiment_name: APS Failure Prediction
